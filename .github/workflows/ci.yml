name: ConfirmBuild

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4
        
      - name: JDKのセットアップ
        uses: actions/setup-java@v4

        with:
          java-version: '25'
          distribution: 'temurin'

      - name: テスト実行
        run: ./mvnw compile